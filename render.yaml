# Render Blueprint: Postgres + the NestJS API (Docker). The web app is deployed to Vercel.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for WEB_ORIGIN (your Vercel URL).
databases:
  - name: koc-db
    plan: free
    region: singapore
    databaseName: kingdom_chess
    user: chess

services:
  - type: web
    name: koc-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: koc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "604800"
      # Exact origin of the web app, e.g. https://koc-ass.vercel.app (no trailing slash)
      - key: WEB_ORIGIN
        sync: false
      # The cookie travels over HTTPS (Vercel) in production
      - key: COOKIE_SECURE
        value: "true"
      - key: PAIRING_WINDOW_MS
        value: "1500"
